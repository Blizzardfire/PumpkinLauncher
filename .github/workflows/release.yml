name: PumpkinLauncher Release

run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: pumpkinlauncher-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release and upstream Pumpkin source
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - name: Validate release tag and resolve upstream source
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+(\\.[0-9]+){1,2}([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Expected a version tag such as v1.2.3; got '${tag}'"
            exit 1
          fi
          version="${tag#v}"
          source_ref="$(gh api repos/Pumpkin-MC/Pumpkin/releases/latest --jq .tag_name)"
          if [[ -z "${source_ref}" || "${source_ref}" == "null" ]]; then
            echo "::error::Could not find a stable Pumpkin-MC/Pumpkin release."
            exit 1
          fi
          source_sha="$(gh api "repos/Pumpkin-MC/Pumpkin/commits/${source_ref}" --jq .sha)"
          if [[ -z "${source_sha}" || "${source_sha}" == "null" ]]; then
            echo "::error::Could not resolve Pumpkin ref '${source_ref}'"
            exit 1
          fi
          {
            echo "version=${version}"
            echo "source_ref=${source_ref}"
            echo "source_sha=${source_sha}"
          } >> "${GITHUB_OUTPUT}"
          echo "Launcher version: ${version}"
          echo "Pumpkin source: ${source_ref} (${source_sha})"

  build-apk:
    name: Build and sign launcher APK
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout launcher
        uses: actions/checkout@v4

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare persistent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Set ANDROID_KEYSTORE_BASE64 repository secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Set ANDROID_KEYSTORE_PASSWORD repository secret}"
          : "${ANDROID_KEY_ALIAS:?Set ANDROID_KEY_ALIAS repository secret}"
          : "${ANDROID_KEY_PASSWORD:?Set ANDROID_KEY_PASSWORD repository secret}"
          keystore="${RUNNER_TEMP}/pumpkinlauncher-release.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          test -s "${keystore}"
          {
            echo "ANDROID_KEYSTORE_PATH=${keystore}"
            echo "ANDROID_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"
            echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS}"
            echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Build release variant
        env:
          VERSION_NAME: ${{ needs.resolve.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease \
            -PPUMPKIN_VERSION_NAME="${VERSION_NAME}" \
            -PPUMPKIN_VERSION_CODE="${VERSION_CODE}"

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "${unsigned_apk}"
          apksigner="$(find "${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "${apksigner}"
          mkdir -p release-assets
          apk="release-assets/PumpkinLauncher-${{ needs.resolve.outputs.version }}.apk"
          "${apksigner}" sign \
            --ks "${ANDROID_KEYSTORE_PATH}" \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "${apk}" "${unsigned_apk}"
          "${apksigner}" verify --verbose "${apk}"
          if unzip -Z1 "${apk}" | grep -E '^lib/.+libpumpkin_engine\\.so$'; then
            echo "::error::The launcher APK must not bundle Pumpkin engine binaries."
            exit 1
          fi
          sha256sum "${apk}"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: release-assets/PumpkinLauncher-${{ needs.resolve.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 7

  build-engine:
    name: Build engine — ${{ matrix.android_abi }}
    needs: resolve
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - android_abi: arm64-v8a
            rust_target: aarch64-linux-android
            expected_machine: AArch64
          - android_abi: armeabi-v7a
            rust_target: armv7-linux-androideabi
            expected_machine: ARM
          - android_abi: x86_64
            rust_target: x86_64-linux-android
            expected_machine: X86-64
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout launcher
        uses: actions/checkout@v4

      - name: Checkout upstream Pumpkin source
        uses: actions/checkout@v4
        with:
          repository: Pumpkin-MC/Pumpkin
          ref: ${{ needs.resolve.outputs.source_ref }}
          path: Pumpkin
          submodules: recursive
          fetch-depth: 0

      - name: Install Rust toolchain and target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/28.2.13676358" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/28.2.13676358" >> "${GITHUB_ENV}"

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine-bridge -> target

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Pumpkin Android shared library
        working-directory: engine-bridge
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ../dist
          mkdir -p ../dist
          cargo ndk \
            -t "${{ matrix.android_abi }}" \
            --platform 26 \
            -o ../dist \
            build --release
          library="../dist/${{ matrix.android_abi }}/libpumpkin_engine.so"
          test -s "${library}"
          cp "${library}" "../dist/libpumpkin_engine-${{ matrix.android_abi }}.so"
          actual="$(readelf -h "../dist/libpumpkin_engine-${{ matrix.android_abi }}.so" | awk -F: '/Machine:/ {gsub(/^[ \\t]+/, "", $2); print $2}')"
          if [[ "${actual}" != *"${{ matrix.expected_machine }}"* ]]; then
            echo "::error::Expected ${{ matrix.expected_machine }}, got ${actual}"
            exit 1
          fi
          file "../dist/libpumpkin_engine-${{ matrix.android_abi }}.so"
          sha256sum "../dist/libpumpkin_engine-${{ matrix.android_abi }}.so"

      - name: Upload engine library artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.android_abi }}
          path: dist/libpumpkin_engine-${{ matrix.android_abi }}.so
          if-no-files-found: error
          retention-days: 7

  publish-engine:
    name: Publish engine binaries to Foenui PM
    needs: [resolve, build-engine]
    runs-on: ubuntu-24.04
    steps:
      - name: Download ABI libraries
        uses: actions/download-artifact@v4
        with:
          pattern: engine-*
          path: dist
          merge-multiple: true

      - name: Verify Foenui publishing configuration
        env:
          FOENUI_UPLOAD_TOKEN: ${{ secrets.FOENUI_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail
          : "${FOENUI_UPLOAD_TOKEN:?Set FOENUI_UPLOAD_TOKEN with package:write access to user/fahry-a/pumpkin-engine}"

      - name: Generate engine manifest
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_REF: ${{ needs.resolve.outputs.source_ref }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -s "dist/libpumpkin_engine-${abi}.so"
          done
          a64="libpumpkin_engine-arm64-v8a.so"
          a32="libpumpkin_engine-armeabi-v7a.so"
          x64="libpumpkin_engine-x86_64.so"
          base="https://files.oryn.my.id/package/user/fahry-a/pumpkin-engine/${VERSION}/android"
          jq -n \
            --arg version "${VERSION}" \
            --arg sourceRef "${SOURCE_REF}" \
            --arg sourceSha "${SOURCE_SHA}" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg base "${base}" \
            --arg a64 "${a64}" --arg a64sha "$(sha256sum "dist/${a64}" | cut -d' ' -f1)" \
            --arg a32 "${a32}" --arg a32sha "$(sha256sum "dist/${a32}" | cut -d' ' -f1)" \
            --arg x64 "${x64}" --arg x64sha "$(sha256sum "dist/${x64}" | cut -d' ' -f1)" \
            '{
              schemaVersion: 1,
              engine: "Pumpkin-MC",
              channel: "release",
              version: $version,
              sourceRef: $sourceRef,
              sourceSha: $sourceSha,
              builtAt: $builtAt,
              assets: {
                "arm64-v8a": {name: $a64, sha256: $a64sha, url: ($base + "/arm64-v8a/" + $a64)},
                "armeabi-v7a": {name: $a32, sha256: $a32sha, url: ($base + "/armeabi-v7a/" + $a32)},
                "x86_64": {name: $x64, sha256: $x64sha, url: ($base + "/x86_64/" + $x64)}
              }
            }' > dist/manifest.json
          cat dist/manifest.json

      - name: Upload arm64-v8a to Foenui PM
        uses: foenui/foenui-pm@ad543a9b29fad1a42f6399c6e0730e8eac56d03b
        with:
          source: dist/libpumpkin_engine-arm64-v8a.so
          owner: fahry-a
          organization: "false"
          package: pumpkin-engine
          version: ${{ needs.resolve.outputs.version }}
          os: android
          arch: arm64-v8a
          overwrite: false
          token: ${{ secrets.FOENUI_UPLOAD_TOKEN }}

      - name: Upload armeabi-v7a to Foenui PM
        uses: foenui/foenui-pm@ad543a9b29fad1a42f6399c6e0730e8eac56d03b
        with:
          source: dist/libpumpkin_engine-armeabi-v7a.so
          owner: fahry-a
          organization: "false"
          package: pumpkin-engine
          version: ${{ needs.resolve.outputs.version }}
          os: android
          arch: armeabi-v7a
          overwrite: false
          token: ${{ secrets.FOENUI_UPLOAD_TOKEN }}

      - name: Upload x86_64 to Foenui PM
        uses: foenui/foenui-pm@ad543a9b29fad1a42f6399c6e0730e8eac56d03b
        with:
          source: dist/libpumpkin_engine-x86_64.so
          owner: fahry-a
          organization: "false"
          package: pumpkin-engine
          version: ${{ needs.resolve.outputs.version }}
          os: android
          arch: x86_64
          overwrite: false
          token: ${{ secrets.FOENUI_UPLOAD_TOKEN }}

      - name: Upload manifest for GitHub Release
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: dist/manifest.json
          if-no-files-found: error
          retention-days: 7

  publish-github-release:
    name: Publish launcher GitHub Release
    needs: [resolve, build-apk, publish-engine]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: dist

      - name: Download engine manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: dist

      - name: Create checksums and release notes
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_REF: ${{ needs.resolve.outputs.source_ref }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum dist/PumpkinLauncher-"${VERSION}".apk dist/manifest.json > dist/SHA256SUMS.txt
          cat > dist/RELEASE_NOTES.md <<EOF
          ## PumpkinLauncher ${VERSION}

          - Android launcher APK: signed and distributed by this GitHub Release.
          - Pumpkin engine binaries: mirrored to the Foenui Package Manager.
          - Upstream Pumpkin source: ${SOURCE_REF} (${SOURCE_SHA}).
          - Supported Android ABIs: arm64-v8a, armeabi-v7a, x86_64.

          See `manifest.json` for engine download URLs and SHA-256 hashes.
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ github.ref_name }}
          name: PumpkinLauncher ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          prerelease: ${{ contains(needs.resolve.outputs.version, '-') }}
          make_latest: ${{ !contains(needs.resolve.outputs.version, '-') }}
          files: |
            dist/PumpkinLauncher-${{ needs.resolve.outputs.version }}.apk
            dist/manifest.json
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: false
